<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V2a Cybertree — ANSI Render</title>
<style>
:root {
  color-scheme: dark;
  --cyan: #1dc7ed;
  --panel: #03070d;
}
* { box-sizing: border-box; }
html, body {
  min-height: 100%;
  margin: 0;
  background: radial-gradient(circle at 50% 42%, #092337 0, #02070d 42%, #000 82%);
}
body {
  display: grid;
  place-items: center;
  padding: 24px;
  overflow: auto;
  font-family: "Cascadia Mono", "Cascadia Code", Consolas, "Lucida Console",
               "Courier New", monospace;
}
.terminal {
  position: relative;
  width: max-content;
  max-width: 100%;
  padding: 10px;
  overflow: auto;
  border: 1px solid var(--cyan);
  background: var(--panel);
  box-shadow: 0 0 0 1px #03151e inset, 0 0 18px #079bd355, 0 0 70px #07527833;
}
.terminal::after {
  content: "";
  pointer-events: none;
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, #00000024 4px);
  mix-blend-mode: multiply;
}
.titlebar, .footer {
  display: flex;
  justify-content: space-between;
  gap: 2ch;
  padding: 4px 8px;
  white-space: nowrap;
}
.titlebar {
  margin-bottom: 9px;
  border: 1px solid #0d7897;
  color: #9defff;
  background: #04131d;
  font-size: 12px;
  line-height: 1.25;
  text-shadow: 0 0 7px #18c1eb;
}
.status { color: #fb88df; }
#art {
  display: block;
  margin: 0;
  width: max-content;
  min-width: max-content;
  overflow: hidden;
  background: #010207;
  font-family: inherit;
  font-size: 10px;
  font-weight: 700;
  line-height: 7.5px;
  letter-spacing: 0;
  font-variant-ligatures: none;
  white-space: pre;
  text-rendering: geometricPrecision;
  -webkit-font-smoothing: none;
  text-shadow: 0 0 3px currentColor;
}
.footer {
  margin-top: 9px;
  border: 1px solid #0a4c63;
  color: #66ddfa;
  background: #020c12;
  font-size: 10px;
  line-height: 1.3;
}
@media (max-width: 620px) {
  body { padding: 8px; place-items: start center; }
  #art { font-size: 7px; line-height: 5.25px; }
  .titlebar, .footer { font-size: 9px; }
}
@media (prefers-reduced-motion: no-preference) {
  .status { animation: pulse 2.4s steps(2, end) infinite; }
  @keyframes pulse { 50% { opacity: .58; } }
}
</style>
</head>

async function decodePayload(base64) {
  if (!("DecompressionStream" in window)) {
    throw new Error(
      "This file needs a browser with DecompressionStream support " +
      "(current Chrome, Edge, Firefox, or Safari)."
    );
  }

  const packed = Uint8Array.from(atob(base64), character =>
    character.charCodeAt(0)
  );

  const stream = new Blob([packed])
    .stream()
    .pipeThrough(new DecompressionStream("gzip"));

  return new Response(stream).text();
}

function render(rows) {
  const art = document.getElementById("art");
  const fragment = document.createDocumentFragment();

  for (const encoded of rows) {
    let activeForeground = -1;
    let activeBackground = -1;
    let buffer = "";

    const flush = () => {
      if (!buffer) return;

      const span = document.createElement("span");
      span.style.color = PALETTE[activeForeground];
      span.style.backgroundColor = PALETTE[activeBackground];
      span.textContent = buffer;
      fragment.appendChild(span);
      buffer = "";
    };

    for (let offset = 0; offset < encoded.length; offset += 3) {
      const foreground = INDEX.indexOf(encoded[offset]);
      const background = INDEX.indexOf(encoded[offset + 1]);
      const mask = Number.parseInt(encoded[offset + 2], 16);

      if (
        foreground !== activeForeground ||
        background !== activeBackground
      ) {
        flush();
        activeForeground = foreground;
        activeBackground = background;
      }

      buffer += QUADRANTS[mask];
    }

    flush();
    fragment.appendChild(document.createTextNode("\n"));
  }

  art.replaceChildren(fragment);
}

decodePayload(PAYLOAD)
  .then(text => render(text.trimEnd().split("\n")))
  .catch(error => {
    const art = document.getElementById("art");
    art.style.color = "#fb88df";
    art.style.lineHeight = "1.35";
    art.textContent = "RENDER FAILURE\n\n" + error.message;
    console.error(error);
  });
</script>
